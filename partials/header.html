    <!-- NAVBAR PRINCIPAL -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- LOGO -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="app.switchTab('catalog')">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-shirt"></i>
                    </div>
                    <div>
                        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">TextilConecta</span>
                        <span class="block text-[10px] text-indigo-400 tracking-widest uppercase font-bold">Orizaba Altas Montañas</span>
                    </div>
                </div>

                <!-- NAVEGACIÓN Y BOTÓN DE CARRITO -->
                <div class="hidden md:flex items-center space-x-2">
                    <nav class="flex space-x-1 lg:space-x-2">
                        <button onclick="app.switchTab('catalog')" id="nav-catalog" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-white bg-indigo-600/30 border border-indigo-500/40">
                            <i class="fa-solid fa-store mr-1.5 text-indigo-400"></i> Catálogo & Cotizador
                        </button>
                        <button onclick="app.switchTab('simulator')" id="nav-simulator" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                            <i class="fa-solid fa-pen-nib mr-1.5 text-emerald-400"></i> Simulador 2D
                        </button>
                        <button onclick="app.switchTab('map')" id="nav-map" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                            <i class="fa-solid fa-map-location-dot mr-1.5 text-amber-400"></i> Mapa de Talleres
                        </button>
                        <button onclick="app.switchTab('register')" id="nav-register" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                            <i class="fa-solid fa-building-circle-check mr-1.5 text-sky-400"></i> Registrar Empresa
                        </button>
                        <button onclick="app.switchTab('tracking')" id="nav-tracking" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
                            <i class="fa-solid fa-truck-fast mr-1.5 text-violet-400"></i> Mis Pedidos
                        </button>
                        
                        <!-- PESTAÑA DINÁMICA DE PANEL TALLER -->
                        <button onclick="app.protectedWorkshopTab()" id="nav-workshop-panel" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition hidden">
                            <i class="fa-solid fa-industry mr-1.5 text-teal-400"></i> Mi Taller B2B
                        </button>

                        <!-- PESTAÑA PROTEGIDA ADMIN -->
                        <button onclick="app.protectedAdminTab()" id="nav-admin" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition hidden">
                            <i class="fa-solid fa-user-gear mr-1.5 text-rose-400"></i> Panel Admin
                        </button>
                    </nav>

                    <!-- BOTÓN DEL CARRITO DE COMPRAS -->
                    <button onclick="app.openCartModal()" class="ml-3 px-3.5 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-cart-shopping text-amber-300"></i>
                        <span>Carrito</span>
                        <span id="cart-badge-count" class="bg-amber-400 text-slate-950 text-xs px-2 py-0.5 rounded-full font-black">0</span>
                    </button>
                </div>

                <div class="flex items-center gap-2 md:hidden">
                    <button onclick="app.openCartModal()" class="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-emerald-600 flex items-center gap-1.5">
                        <i class="fa-solid fa-cart-shopping text-amber-300"></i>
                        <span id="cart-badge-count-mobile" class="bg-amber-400 text-slate-950 text-[10px] px-1.5 py-0.2 rounded-full font-black">0</span>
                    </button>
                    <button onclick="app.toggleMobileMenu()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden border-b border-slate-800 bg-slate-900 px-4 pt-2 pb-4 space-y-2">
            <button onclick="app.switchTab('catalog'); app.toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">
                <i class="fa-solid fa-store mr-2 text-indigo-400"></i> Catálogo & Cotizador
            </button>
            <button onclick="app.switchTab('simulator'); app.toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">
                <i class="fa-solid fa-pen-nib mr-2 text-emerald-400"></i> Simulador 3D
            </button>
            <button onclick="app.switchTab('map'); app.toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">
                <i class="fa-solid fa-map-location-dot mr-2 text-amber-400"></i> Mapa de Talleres
            </button>
            <button onclick="app.switchTab('register'); app.toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">
                <i class="fa-solid fa-building-circle-check mr-2 text-sky-400"></i> Registrar Empresa
            </button>
            <button onclick="app.switchTab('tracking'); app.toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800">
                <i class="fa-solid fa-truck-fast mr-2 text-violet-400"></i> Mis Pedidos
            </button>
            <button onclick="app.protectedAdminTab(); app.toggleMobileMenu();" id="nav-admin-mobile" class="w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-800 hidden">
                <i class="fa-solid fa-user-gear mr-2 text-rose-400"></i> Panel Admin
            </button>
        </div>
    </header>
