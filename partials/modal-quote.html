    <!-- MODAL COTIZADOR -->
    <div id="quote-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden my-8">
            <div class="bg-slate-950 px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                        <i class="fa-solid fa-calculator text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-white" id="modal-product-title">Cotizador B2B</h3>
                        <p class="text-xs text-slate-400" id="modal-product-category">Selecciona cantidad y compara proveedores</p>
                    </div>
                </div>
                <button onclick="app.closeQuoteModal()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-6 space-y-6 max-h-[80vh] overflow-y-auto custom-scrollbar">
                <div id="modal-product-header-info" class="flex flex-col sm:flex-row gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800 items-center"></div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950/60 p-4 rounded-xl border border-slate-800">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">1. Cantidad Total de Piezas *</label>
                        <div class="flex items-center gap-2">
                            <input type="number" id="quote-qty-input" min="10" value="50" onchange="app.recalculateQuoteSuppliers()" oninput="app.recalculateQuoteSuppliers()" class="w-full bg-slate-950 border border-indigo-500/50 rounded-lg px-3 py-2 text-sm text-indigo-300 font-bold focus:outline-none focus:border-indigo-400">
                            <span class="text-xs text-slate-400 font-semibold whitespace-nowrap">pzs</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">2. Color Principal *</label>
                        <select id="quote-color-select" onchange="app.toggleCustomQuoteColor()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
                            <option value="Negro Industrial">Negro Industrial</option>
                            <option value="Azul Marino">Azul Marino Corporativo</option>
                            <option value="Blanco Puro">Blanco Puro</option>
                            <option value="Gris Oxford">Gris Oxford</option>
                            <option value="Rojo Vivo">Rojo Vivo</option>
                            <option value="Verde Botella">Verde Botella</option>
                            <option value="custom">Elegir un color personalizado</option>
                        </select>
                        <div id="quote-custom-color-container" class="hidden mt-2 flex items-center gap-3">
                            <input type="color" id="quote-custom-color" value="#3b82f6" oninput="app.updateCustomQuoteColor()" aria-label="Elige un color personalizado"
                                class="h-9 w-12 cursor-pointer rounded border border-slate-700 bg-slate-950 p-1">
                            <span class="text-xs text-slate-400">Color seleccionado: <strong id="quote-custom-color-value" class="font-mono text-slate-200">#3b82f6</strong></span>
                        </div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-industry text-indigo-400"></i>
                            3. Selecciona la Empresa Proveedora:
                        </h4>
                        <span class="text-[11px] text-emerald-400 font-medium" id="suppliers-count-badge">Tarifas calculadas en tiempo real</span>
                    </div>

                    <div id="modal-workshops-cards" class="space-y-3"></div>
                </div>
            </div>

            <div class="bg-slate-950 px-6 py-4 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-3">
                <button onclick="app.closeQuoteModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white">Cancelar</button>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <button id="modal-cart-btn" disabled onclick="app.agregarAlCarritoDesdeCotizacion()" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 text-slate-500 font-bold text-xs uppercase rounded-xl transition cursor-not-allowed">
                        <i class="fa-solid fa-cart-plus mr-1"></i> Añadir al Carrito
                    </button>
                    <button id="modal-proceed-btn" disabled onclick="app.startCheckoutFlow()" class="flex-1 sm:flex-none px-5 py-2.5 bg-slate-800 text-slate-500 font-bold text-xs uppercase rounded-xl transition cursor-not-allowed">
                        <i class="fa-solid fa-bolt mr-1"></i> Pagar de Una Vez
                    </button>
                </div>
            </div>
        </div>
    </div>
