            <div class="bg-slate-950 px-6 py-4 border-b border-slate-800 flex justify-between items-center">

                    <i class="fa-solid fa-cart-shopping text-amber-400"></i>

                <button onclick="app.closeCartModal()" class="text-slate-400 hover:text-white text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            <div class="p-6 space-y-4 max-h-[65vh] overflow-y-auto custom-scrollbar">
