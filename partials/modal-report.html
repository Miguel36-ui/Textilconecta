    <!-- MODAL REGISTRO DE QUEJA ADMIN -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-4">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
                Registrar Queja / Llamada de Atención
            </h3>
            <p class="text-xs text-slate-400">Al acumular 3 quejas registradas, la empresa pasará automáticamente a estado <strong>Dada de Baja</strong>.</p>
            
            <form onsubmit="app.handleCreateReport(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Empresa / Taller Sancionado *</label>
                    <select id="rep-workshop-select" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white font-semibold"></select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Cliente que emite la queja *</label>
                    <input type="text" id="rep-client" required placeholder="Ej. Uniformes Corporativos del Golfo" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white">
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">Motivo / Descripción del Incumplimiento *</label>
                    <textarea id="rep-desc" required rows="3" placeholder="Describa la falla (ej: Retraso en entrega, defecto en bordado, etc)..." class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="app.closeReportModal()" class="px-3 py-2 text-slate-400 hover:text-white">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg shadow">
                        Aplicar Sanción / Registrar
                    </button>
                </div>
            </form>
        </div>
    </div>
